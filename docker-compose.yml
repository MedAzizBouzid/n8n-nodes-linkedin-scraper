version: '3.8'

services:
  n8n:
    # Tell this service to build from your Dockerfile
    # instead of pulling a pre-made image.
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
    volumes:
      # This is for your n8n data (workflows, credentials)
      - ./n8n_data:/home/node/.n8n
      # ADD THIS LINE: This mounts your scripts,
      # which was previously in your 'scraper' service.
      - ./jobs-scraper:/scripts

# You no longer need the separate 'scraper' service,
# so delete it from this file.
